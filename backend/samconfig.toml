# SAM deploy configuration — SmartSort backend
version = 0.1

[default]
[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "smartsort-backend"
region = "ap-south-1"
resolve_s3 = true
s3_prefix = "smartsort-backend"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
# DEV origin (Vite dev server) is the default deploy path — the wildcard CORS
# default in template.yaml is only reachable by explicit override.
# AlarmEmail is deliberately NOT set here: it is a REQUIRED parameter, so the
# first `sam deploy` aborts until you add a real address here or pass
#   --parameter-overrides AlarmEmail=you@example.com
# For the production/Amplify deployment also override the origin:
#   sam deploy --parameter-overrides AllowedOrigin=https://<amplify-domain> AlarmEmail=<email>
parameter_overrides = ["AllowedOrigin=http://localhost:5173"]
